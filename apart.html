<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Days Apart 💕</title>
<style>
:root {
  --bg: #fff5f7;
  --card: #ffffff;
  --ink: #381a24;
  --mute: #9e7582;
  --a: #4361ee;
  --b: #e63974;
  --love: #ff3366;
  --line: #fae1e7;
  --line-strong: #f3c7d2;
  --today: #e63974;
  --shadow: 0 4px 20px rgba(220, 80, 120, 0.07);
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #180e13;
    --card: #24141c;
    --ink: #faedf1;
    --mute: #b893a0;
    --a: #6b8aff;
    --b: #ff6599;
    --love: #ff527b;
    --line: #3b222f;
    --line-strong: #523142;
    --today: #ff6599;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 18px 16px 48px;
}
h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.sub {
  color: var(--mute);
  font-size: 13px;
  margin-top: 2px;
}
.btn {
  padding: 11px 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn:active {
  transform: scale(0.97);
}
.btn.p {
  background: linear-gradient(135deg, #ff4d6d, #e63974);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 14px rgba(230, 57, 116, 0.28);
}
.btn.sm {
  padding: 8px 12px;
  font-size: 13px;
  border-radius: 12px;
}
.badge-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--love);
  background: rgba(255, 77, 109, 0.09);
  padding: 3px 10px;
  border-radius: 12px;
  margin-top: 5px;
  font-weight: 600;
}
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 16px 0;
}
.c {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 13px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.c::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
}
.c.a::before { background: linear-gradient(90deg, #4361ee, #6b8aff); }
.c.b::before { background: linear-gradient(90deg, #ff4d6d, #e63974); }
.c b {
  display: block;
  font-size: 32px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.5px;
}
.c.a b { color: var(--a); }
.c.b b { color: var(--b); }
.c span {
  font-size: 12px;
  color: var(--mute);
  display: block;
  margin-top: 2px;
}
.c span.hl {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-top: 3px;
}
.tot {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(230, 57, 116, 0.05), rgba(67, 97, 238, 0.05));
  border: 1px solid var(--line-strong);
}
.tot::before { display: none; }
.tot b {
  font-size: 26px;
  color: var(--love);
}
.banner {
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 16px;
  padding: 13px 15px;
  margin: 14px 0;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  line-height: 1.45;
  box-shadow: var(--shadow);
}
.banner .bi {
  font-size: 24px;
  line-height: 1;
  flex-shrink: 0;
}
.banner strong {
  color: var(--ink);
}
.calendar-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
  box-shadow: var(--shadow);
  margin-top: 14px;
}
.mh {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.mh strong {
  font-size: 17px;
  font-weight: 700;
}
.nav {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s ease;
}
.nav:active {
  transform: scale(0.92);
}
.g {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.dow {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--mute);
  padding: 4px 0;
}
.d {
  position: relative;
  aspect-ratio: 1;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s ease, background 0.15s ease;
}
.d:active {
  transform: scale(0.92);
}
.d.empty {
  border: 0;
  background: none;
  cursor: default;
}
.d.today {
  border: 2px solid var(--today);
  font-weight: 700;
  color: var(--today);
}
.d .dots {
  position: absolute;
  bottom: 3px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 3px;
}
.d .dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.i-a { background: var(--a); }
.i-b { background: var(--b); }
.leg {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  font-size: 12px;
  color: var(--mute);
  margin: 12px 0 6px;
}
.leg span {
  display: flex;
  align-items: center;
}
.leg i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  flex-shrink: 0;
}
.calendar-hint {
  text-align: center;
  color: var(--mute);
  font-size: 12px;
  margin: 10px 0 4px;
}
.box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  margin-top: 14px;
  box-shadow: var(--shadow);
}
.box h2 {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 700;
}
input {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  width: 100%;
  min-width: 0;
}
input:focus {
  outline: none;
  border-color: var(--love);
}
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--mute);
  margin: 8px 0 4px;
}
.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.st {
  text-align: center;
  color: var(--mute);
  font-size: 12px;
  margin-top: 14px;
}
.err {
  color: #e63946;
  background: rgba(230, 57, 70, 0.08);
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  margin: 12px 0;
}
.who-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 18px;
}
.who-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.who-btn:active {
  transform: scale(0.98);
}
.who-avatar {
  font-size: 32px;
  line-height: 1;
}
.who-name {
  font-size: 18px;
  font-weight: 700;
}
.who-sub {
  font-size: 13px;
  color: var(--mute);
  margin-top: 2px;
}
.footer-quote {
  text-align: center;
  font-size: 12px;
  color: var(--mute);
  margin-top: 26px;
  font-style: italic;
  opacity: 0.85;
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ---- Fill these in with your JSONBin.io access key and bin ids ----
// Or leave them empty and the app will ask for them on first open.
var CONFIG={
  key:"$2a$10$8ZB61NcZd6P2vHZIco0ybOl7ckQuIWSD05tHpVpBmkYwtM2FRDkxi",
  ids:"6afaeed1ac6210605a8bae83",
  me:"6afaef15ac6210605a8baf29",
  wife:"6afaeef9ac6210605a8baed5"
};
// -------------------------------------------------------------------
(function(){
var API="https://api.jsonbin.io/v3/b/";
var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
var cfg=CONFIG,who=null,people=null,data={me:[],wife:[]},status="",err="",screen="main";
var view=new Date();view.setDate(1);
try{
  var sc=JSON.parse(localStorage.getItem("apart-cfg")||"null");
  if(sc&&sc.ids&&sc.me&&sc.wife&&sc.key)cfg=sc;
  who=localStorage.getItem("apart-who");
}catch(e){}
if(!(cfg.key&&cfg.ids&&cfg.me&&cfg.wife))screen="setup";

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pad(n){return n<10?"0"+n:""+n}
function ds(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function today(){var n=new Date();return ds(n.getFullYear(),n.getMonth(),n.getDate())}

// Strictly marks the partner:
// Sabaa marks Vishu away. Vishu marks Sabaa away.
function target(){
  return who==="me"?"wife":"me";
}

function get(id){
  return fetch(API+id+"/latest",{
    cache:"no-store",
    headers:{
      "X-Access-Key":cfg.key,
      "X-Bin-Meta":"false"
    }
  }).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    return (j&&j.record!==undefined)?j.record:j;
  });
}

function put(id,obj){
  return fetch(API+id,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Access-Key":cfg.key
    },
    body:JSON.stringify(obj)
  }).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  });
}

function name(k){return people&&people[k]&&people[k].name?people[k].name:(k==="me"?"Vishu":"Sabaa")}
function clean(a){return Array.isArray(a)?a.filter(function(x){return /^\d{4}-\d{2}-\d{2}$/.test(x)}):[]}

function load(){
  status="Loading…";err="";paint();
  return get(cfg.ids).then(function(j){
    if(!j||!j.me||!j.wife){
      j={me:{id:"vishu",name:"Vishu"},wife:{id:"sabaa",name:"Sabaa"}};
      return put(cfg.ids,j).then(function(){return j});
    }
    return j;
  }).then(function(j){
    people=j;
    return Promise.all([get(cfg.me),get(cfg.wife)]);
  }).then(function(r){
    data.me=clean(r[0]&&(r[0].dates||(Array.isArray(r[0])?r[0]:[])));
    data.wife=clean(r[1]&&(r[1].dates||(Array.isArray(r[1])?r[1]:[])));
    status="Updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});paint();
  }).catch(function(e){status="";err="Couldn’t reach JSONBin ("+e.message+"). Check your access key and bin IDs.";paint()});
}

function saveTarget(){
  var tg=target();
  var id=tg==="me"?cfg.me:cfg.wife;
  status="Saving with love… ❤️";setS();
  put(id,{owner:people&&people[tg]?people[tg].id:tg,dates:data[tg].slice().sort()}).then(function(){
    status="Saved with love ❤️";setS();
  }).catch(function(e){
    status="";err="Save failed ("+e.message+")";paint();
  });
}
function setS(){var e=document.getElementById("st");if(e)e.textContent=status}

function stretches(a){var s=a.slice().sort(),n=0,prev=null;s.forEach(function(d){var t=Date.parse(d+"T00:00:00Z");if(prev===null||t-prev>864e5)n++;prev=t});return n}
function union(){var o={};data.me.concat(data.wife).forEach(function(d){o[d]=1});return Object.keys(o).length}

function toggle(d){
  var tg=target();
  var a=data[tg],i=a.indexOf(d);
  if(i>-1)a.splice(i,1);
  else a.push(d);
  saveTarget();
  paint();
}

function addRange(f,to){
  if(!f||!to)return;if(f>to){var x=f;f=to;to=x}
  var tg=target();
  var a=Date.parse(f+"T00:00:00Z"),b=Date.parse(to+"T00:00:00Z"),n=0;
  for(var ms=a;ms<=b&&n<800;ms+=864e5,n++){
    var d=new Date(ms).toISOString().slice(0,10);
    if(data[tg].indexOf(d)<0)data[tg].push(d);
  }
  saveTarget();
  paint();
}

function removeRange(f,to){
  if(!f||!to)return;if(f>to){var x=f;f=to;to=x}
  var tg=target();
  data[tg]=data[tg].filter(function(d){return d<f||d>to});
  saveTarget();
  paint();
}

function paint(){
  var app=document.getElementById("app");app.textContent="";
  if(screen==="setup")return setup(app);
  if(!who||!people||(who!=="me"&&who!=="wife")){
    if(!people){
      app.appendChild(el("h1",null,"Days Apart 💕"));
      app.appendChild(el("p","sub",status||"Loading your story…"));
      if(err){
        app.appendChild(el("p","err",err));
        var rs=el("button","btn","Change bin settings");
        rs.onclick=function(){screen="setup";paint()};
        app.appendChild(rs);
      }
      return;
    }
    app.appendChild(el("h1",null,"Days Apart 💕"));
    app.appendChild(el("p","sub","Who is opening the app today?"));
    var w=el("div","who-card");
    [
      {k:"me",name:name("me"),avatar:"👨🏻",other:name("wife")},
      {k:"wife",name:name("wife"),avatar:"👩🏻",other:name("me")}
    ].forEach(function(p){
      var b=el("button","who-btn");
      b.appendChild(el("span","who-avatar",p.avatar));
      var info=el("div");
      info.appendChild(el("div","who-name",p.name));
      info.appendChild(el("div","who-sub","I'm missing "+p.other+" · Mark "+p.other+" away"));
      b.appendChild(info);
      b.onclick=function(){
        who=p.k;
        try{localStorage.setItem("apart-who",p.k)}catch(e){}
        paint();
      };
      w.appendChild(b);
    });
    app.appendChild(w);
    var fq=el("div","footer-quote","\"Distance means so little when someone means so much.\" 💕");
    app.appendChild(fq);
    return;
  }

  var tg=target();
  var hd=el("div","row");
  var t=el("div");
  t.appendChild(el("h1",null,"Days Apart 💕"));
  t.appendChild(el("div","sub","Signed in as "+name(who)+" ❤️"));
  var badge=el("div","badge-tag","Marking days "+name(tg)+" is away from you");
  t.appendChild(badge);
  hd.appendChild(t);

  var bs=el("div");bs.style.display="flex";bs.style.gap="6px";
  var rf=el("button","btn sm","↻");rf.setAttribute("aria-label","Refresh");rf.onclick=load;
  var sw=el("button","btn sm","Switch");sw.onclick=function(){who=null;try{localStorage.removeItem("apart-who")}catch(e){}paint()};
  var st=el("button","btn sm","⚙");st.setAttribute("aria-label","Settings");st.onclick=function(){screen="setup";paint()};
  bs.appendChild(rf);bs.appendChild(sw);bs.appendChild(st);hd.appendChild(bs);app.appendChild(hd);
  if(err)app.appendChild(el("p","err",err));

  // Romantic comparison banner
  var v=data.me.length,s=data.wife.length;
  var bn=el("div","banner");
  bn.appendChild(el("span","bi","💌"));
  var bt=el("div");
  if(v>s){
    var d=v-s;
    bt.innerHTML="<strong>"+name("wife")+"</strong> has spent <strong>"+d+" more day"+(d===1?"":"s")+"</strong> waiting without "+name("me")+" 🥺";
  }else if(s>v){
    var d=s-v;
    bt.innerHTML="<strong>"+name("me")+"</strong> has spent <strong>"+d+" more day"+(d===1?"":"s")+"</strong> waiting without "+name("wife")+" 🥺";
  }else if(v>0){
    bt.innerHTML="A shared journey of love: you both have waited the <strong>exact same duration</strong> ("+v+" days each) 💞";
  }else{
    bt.innerHTML="<strong>Together every single day</strong> — no days apart logged yet! 💍💕";
  }
  bn.appendChild(bt);
  app.appendChild(bn);

  // Cards
  var cards=el("div","cards");
  var c1=el("div","c a");
  c1.appendChild(el("b",null,data.me.length));
  c1.appendChild(el("span","hl","👩🏻 "+name("wife")+" without "+name("me")));
  c1.appendChild(el("span",null,name("me")+" was away · "+stretches(data.me)+" stretch"+(stretches(data.me)===1?"":"es")));
  cards.appendChild(c1);

  var c2=el("div","c b");
  c2.appendChild(el("b",null,data.wife.length));
  c2.appendChild(el("span","hl","👨🏻 "+name("me")+" without "+name("wife")));
  c2.appendChild(el("span",null,name("wife")+" was away · "+stretches(data.wife)+" stretch"+(stretches(data.wife)===1?"":"es")));
  cards.appendChild(c2);

  var tot=el("div","c tot");
  var tl=el("div");
  tl.appendChild(el("span","hl","Total Days Apart 💞"));
  tl.appendChild(el("span",null,"Days with at least one of you away"));
  tot.appendChild(tl);
  tot.appendChild(el("b",null,union()+(union()===1?" day":" days")));
  cards.appendChild(tot);
  app.appendChild(cards);

  // Calendar Card
  var calCard=el("div","calendar-card");
  var mh=el("div","mh");
  var pv=el("button","nav","‹");pv.onclick=function(){view.setMonth(view.getMonth()-1);paint()};
  var nx=el("button","nav","›");nx.onclick=function(){view.setMonth(view.getMonth()+1);paint()};
  mh.appendChild(pv);mh.appendChild(el("strong",null,MON[view.getMonth()]+" "+view.getFullYear()));mh.appendChild(nx);calCard.appendChild(mh);

  var g=el("div","g");["S","M","T","W","T","F","S"].forEach(function(x){g.appendChild(el("div","dow",x))});
  var y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),td=today();
  for(var i=0;i<first;i++)g.appendChild(el("div","d empty"));
  for(var d=1;d<=dim;d++){(function(d){
    var k=ds(y,m,d),b=el("button","d"+(k===td?" today":""),d),dots=el("span","dots");
    if(data.me.indexOf(k)>-1)dots.appendChild(el("i","i-a"));
    if(data.wife.indexOf(k)>-1)dots.appendChild(el("i","i-b"));
    b.appendChild(dots);
    b.onclick=function(){toggle(k)};
    g.appendChild(b);
  })(d)}
  calCard.appendChild(g);

  var lg=el("div","leg");
  var l1=el("span");l1.appendChild(el("i","i-a"));l1.appendChild(document.createTextNode(name("wife")+" without "+name("me")+" ("+name("me")+" away)"));
  var l2=el("span");l2.appendChild(el("i","i-b"));l2.appendChild(document.createTextNode(name("me")+" without "+name("wife")+" ("+name("wife")+" away)"));
  lg.appendChild(l1);lg.appendChild(l2);
  calCard.appendChild(lg);

  calCard.appendChild(el("p","calendar-hint","Tap any date to mark or unmark when "+name(tg)+" was away from you 💕"));
  app.appendChild(calCard);

  // Range Box
  var bx=el("div","box");bx.appendChild(el("h2",null,"Mark a trip away for "+name(tg)+" ✈️"));
  var two=el("div","two"),fa=el("div"),ta=el("div");
  fa.appendChild(el("label",null,"From"));var fi=el("input");fi.type="date";fa.appendChild(fi);
  ta.appendChild(el("label",null,"To"));var ti=el("input");ti.type="date";ta.appendChild(ti);
  two.appendChild(fa);two.appendChild(ta);bx.appendChild(two);
  var br=el("div","two");br.style.marginTop="12px";
  var ad=el("button","btn p","Mark "+name(tg)+" away 💕");ad.onclick=function(){addRange(fi.value,ti.value)};
  var rm=el("button","btn","Unmark "+name(tg));rm.onclick=function(){removeRange(fi.value,ti.value)};
  br.appendChild(ad);br.appendChild(rm);bx.appendChild(br);app.appendChild(bx);

  var s=el("div","st",status);s.id="st";app.appendChild(s);
  var fq=el("div","footer-quote","\"Distance means so little when someone means so much.\" 💕");
  app.appendChild(fq);
}

function setup(app){
  app.appendChild(el("h1",null,"Setup JSONBin 💕"));
  app.appendChild(el("p","sub","Enter your JSONBin.io access key and bin IDs for the user config and personal calendars."));
  var f={};
  [
    ["key","Access Key (X-Access-Key)"],
    ["ids","Users Bin ID (users)"],
    ["me","Vishu Bin ID (vishu)"],
    ["wife","Sabaa Bin ID (sabaa)"]
  ].forEach(function(p){
    app.appendChild(el("label",null,p[1]));var i=el("input");i.type="text";i.autocapitalize="off";i.autocomplete="off";i.value=cfg[p[0]]||"";f[p[0]]=i;app.appendChild(i);
  });
  var b=el("button","btn p","Save and open");b.style.marginTop="16px";b.style.width="100%";
  b.onclick=function(){
    var n={key:f.key.value.trim(),ids:f.ids.value.trim(),me:f.me.value.trim(),wife:f.wife.value.trim()};
    if(!n.key||!n.ids||!n.me||!n.wife)return;
    cfg=n;try{localStorage.setItem("apart-cfg",JSON.stringify(n))}catch(e){}
    screen="main";people=null;load();
  };
  app.appendChild(b);
  if(people){var c=el("button","btn","Cancel");c.style.marginTop="8px";c.style.width="100%";c.onclick=function(){screen="main";paint()};app.appendChild(c)}
  app.appendChild(el("p","sub","Your credentials and bin IDs are stored locally in your browser."));
}

paint();
if(screen!=="setup")load();
document.addEventListener("visibilitychange",function(){if(!document.hidden&&screen==="main"&&people&&document.activeElement.tagName!=="INPUT")load()});
})();
</script>
</body>
</html>

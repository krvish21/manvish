<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Days Apart</title>
<style>
:root{--bg:#f8f5f6;--card:#fff;--ink:#2a1f24;--mute:#7c6b72;--a:#2f6fd0;--b:#d6407a;--line:#eadfe3;--today:#2a1f24;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#171216;--card:#231b21;--ink:#f3eaee;--mute:#a897a0;--a:#6aa1ff;--b:#ff7ab0;--line:#34282f;--today:#f3eaee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:16px 14px 40px}
h1{margin:0;font-size:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--mute);font-size:13px}
.btn{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--a);border-color:var(--a);color:#fff}
.btn.sm{padding:7px 10px;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.c b{display:block;font-size:30px;line-height:1.1}
.c span{font-size:12px;color:var(--mute);display:block}
.c span.hl{font-size:13px;font-weight:700;margin-top:2px;color:var(--ink)}
.c.a b{color:var(--a)}.c.b b{color:var(--b)}
.tot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.tot b{font-size:24px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.4}
.banner strong{color:var(--ink)}
.target-bar{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:13px;color:var(--mute)}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.pill.active{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
.mh{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.mh strong{font-size:17px}
.nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.d{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:0;cursor:pointer}
.d.empty{border:0;background:none;cursor:default}
.d.today{border:2px solid var(--today)}
.d .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.d .dots i{width:7px;height:7px;border-radius:50%}
.i-a{background:var(--a)}.i-b{background:var(--b)}
.leg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--mute);margin:10px 0}
.leg span{display:flex;align-items:center}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;flex-shrink:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.box h2{margin:0 0 8px;font-size:15px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{text-align:center;color:var(--mute);font-size:12px;margin-top:14px}
.err{color:#c2410c}
.who{display:flex;flex-direction:column;gap:10px;margin-top:16px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ---- Fill these in with your JSONBin.io access key and bin ids ----
// Or leave them empty and the app will ask for them on first open.
var CONFIG={
  key:"$2a$10$8ZB61NcZd6P2vHZIco0ybOl7ckQuIWSD05tHpVpBmkYwtM2FRDkxi",
  ids:"6afaeed1ac6210605a8bae83",
  me:"6afaef15ac6210605a8baf29",
  wife:"6afaeef9ac6210605a8baed5"
};
// -------------------------------------------------------------------
(function(){
var API="https://api.jsonbin.io/v3/b/";
var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
var cfg=CONFIG,who=null,people=null,data={me:[],wife:[]},status="",err="",screen="main",activeTarget=null;
var view=new Date();view.setDate(1);
try{
  var sc=JSON.parse(localStorage.getItem("apart-cfg")||"null");
  if(sc&&sc.ids&&sc.me&&sc.wife&&sc.key)cfg=sc;
  who=localStorage.getItem("apart-who");
}catch(e){}
if(!(cfg.key&&cfg.ids&&cfg.me&&cfg.wife))screen="setup";

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pad(n){return n<10?"0"+n:""+n}
function ds(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function today(){var n=new Date();return ds(n.getFullYear(),n.getMonth(),n.getDate())}
function getTarget(){
  if(activeTarget==="me"||activeTarget==="wife")return activeTarget;
  return who==="me"?"wife":"me";
}
function get(id){
  return fetch(API+id+"/latest",{
    cache:"no-store",
    headers:{
      "X-Access-Key":cfg.key,
      "X-Bin-Meta":"false"
    }
  }).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    return (j&&j.record!==undefined)?j.record:j;
  });
}
function put(id,obj){
  return fetch(API+id,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Access-Key":cfg.key
    },
    body:JSON.stringify(obj)
  }).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  });
}
function name(k){return people&&people[k]&&people[k].name?people[k].name:(k==="me"?"Vishu":"Sabaa")}
function clean(a){return Array.isArray(a)?a.filter(function(x){return /^\d{4}-\d{2}-\d{2}$/.test(x)}):[]}

function load(){
  status="Loading…";err="";paint();
  return get(cfg.ids).then(function(j){
    if(!j||!j.me||!j.wife){
      j={me:{id:"vishu",name:"Vishu"},wife:{id:"sabaa",name:"Sabaa"}};
      return put(cfg.ids,j).then(function(){return j});
    }
    return j;
  }).then(function(j){
    people=j;
    return Promise.all([get(cfg.me),get(cfg.wife)]);
  }).then(function(r){
    data.me=clean(r[0]&&(r[0].dates||(Array.isArray(r[0])?r[0]:[])));
    data.wife=clean(r[1]&&(r[1].dates||(Array.isArray(r[1])?r[1]:[])));
    status="Updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});paint();
  }).catch(function(e){status="";err="Couldn’t reach JSONBin ("+e.message+"). Check your access key and bin IDs.";paint()});
}
function saveTarget(t){
  if(!t)t=getTarget();
  var id=t==="me"?cfg.me:cfg.wife;
  status="Saving…";setS();
  put(id,{owner:people&&people[t]?people[t].id:t,dates:data[t].slice().sort()}).then(function(){status="Saved";setS()}).catch(function(e){status="";err="Save failed ("+e.message+")";paint()});
}
function setS(){var e=document.getElementById("st");if(e)e.textContent=status}

function stretches(a){var s=a.slice().sort(),n=0,prev=null;s.forEach(function(d){var t=Date.parse(d+"T00:00:00Z");if(prev===null||t-prev>864e5)n++;prev=t});return n}
function union(){var o={};data.me.concat(data.wife).forEach(function(d){o[d]=1});return Object.keys(o).length}
function toggle(d){var tg=getTarget();var a=data[tg],i=a.indexOf(d);if(i>-1)a.splice(i,1);else a.push(d);saveTarget(tg);paint()}
function addRange(f,to){
  if(!f||!to)return;if(f>to){var x=f;f=to;to=x}
  var tg=getTarget();
  var a=Date.parse(f+"T00:00:00Z"),b=Date.parse(to+"T00:00:00Z"),n=0;
  for(var ms=a;ms<=b&&n<800;ms+=864e5,n++){var d=new Date(ms).toISOString().slice(0,10);if(data[tg].indexOf(d)<0)data[tg].push(d)}
  saveTarget(tg);paint();
}
function removeRange(f,to){
  if(!f||!to)return;if(f>to){var x=f;f=to;to=x}
  var tg=getTarget();
  data[tg]=data[tg].filter(function(d){return d<f||d>to});saveTarget(tg);paint();
}

function paint(){
  var app=document.getElementById("app");app.textContent="";
  if(screen==="setup")return setup(app);
  if(!who||!people||(who!=="me"&&who!=="wife")){
    if(!people){app.appendChild(el("h1",null,"Days Apart 💕"));app.appendChild(el("p","sub",status||"Loading…"));if(err){app.appendChild(el("p","err",err));var rs=el("button","btn","Change bin settings");rs.onclick=function(){screen="setup";paint()};app.appendChild(rs)}return}
    app.appendChild(el("h1",null,"Who are you?"));
    app.appendChild(el("p","sub","Select who is signing in to mark the other away:"));
    var w=el("div","who");
    [["me","wife"],["wife","me"]].forEach(function(p){
      var b=el("button","btn p",name(p[0])+" (marks "+name(p[1])+" away)");
      b.onclick=function(){who=p[0];activeTarget=null;try{localStorage.setItem("apart-who",p[0])}catch(e){}paint()};
      w.appendChild(b);
    });
    app.appendChild(w);return;
  }
  var tg=getTarget();
  var other=who==="me"?"wife":"me";
  var hd=el("div","row");var t=el("div");
  t.appendChild(el("h1",null,"Days Apart 💕"));
  t.appendChild(el("div","sub","Signed in as "+name(who)+" · Marking "+name(tg)+" away"));
  hd.appendChild(t);
  var bs=el("div");bs.style.display="flex";bs.style.gap="6px";
  var rf=el("button","btn sm","↻");rf.setAttribute("aria-label","Refresh");rf.onclick=load;
  var sw=el("button","btn sm","Switch");sw.onclick=function(){who=null;activeTarget=null;try{localStorage.removeItem("apart-who")}catch(e){}paint()};
  var st=el("button","btn sm","⚙");st.setAttribute("aria-label","Settings");st.onclick=function(){screen="setup";paint()};
  bs.appendChild(rf);bs.appendChild(sw);bs.appendChild(st);hd.appendChild(bs);app.appendChild(hd);
  if(err)app.appendChild(el("p","err",err));

  var v=data.me.length,s=data.wife.length;
  var bn=el("div","banner");
  var bi=el("span",null,"💌");bi.style.fontSize="20px";bn.appendChild(bi);
  var bt=el("div");
  if(v>s){
    var d=v-s;
    bt.innerHTML="<strong>"+name("wife")+"</strong> has stayed without <strong>"+name("me")+"</strong> for <strong>"+d+" more day"+(d===1?"":"s")+"</strong>.";
  }else if(s>v){
    var d=s-v;
    bt.innerHTML="<strong>"+name("me")+"</strong> has stayed without <strong>"+name("wife")+"</strong> for <strong>"+d+" more day"+(d===1?"":"s")+"</strong>.";
  }else if(v>0){
    bt.innerHTML="You both have stayed without each other for the <strong>exact same duration</strong> ("+v+" days each).";
  }else{
    bt.innerHTML="No days apart logged yet — <strong>always together</strong> 💕";
  }
  bn.appendChild(bt);
  app.appendChild(bn);

  var cards=el("div","cards");
  var c1=el("div","c a");
  c1.appendChild(el("b",null,data.me.length));
  c1.appendChild(el("span","hl",name("wife")+" without "+name("me")));
  c1.appendChild(el("span",null,name("me")+" was away · "+stretches(data.me)+" stretch"+(stretches(data.me)===1?"":"es")));
  cards.appendChild(c1);

  var c2=el("div","c b");
  c2.appendChild(el("b",null,data.wife.length));
  c2.appendChild(el("span","hl",name("me")+" without "+name("wife")));
  c2.appendChild(el("span",null,name("wife")+" was away · "+stretches(data.wife)+" stretch"+(stretches(data.wife)===1?"":"es")));
  cards.appendChild(c2);

  var tot=el("div","c tot");
  var tl=el("div");
  tl.appendChild(el("span","hl","Total Days Apart"));
  tl.appendChild(el("span",null,"Days with at least one of you away"));
  tot.appendChild(tl);
  tot.appendChild(el("b",null,union()));
  cards.appendChild(tot);
  app.appendChild(cards);

  var tb=el("div","target-bar");
  tb.appendChild(el("span",null,"Currently marking:"));
  [["wife",name("wife")+" away"],["me",name("me")+" away"]].forEach(function(item){
    var p=el("button","pill"+(tg===item[0]?" active":""),item[1]);
    p.onclick=function(){activeTarget=item[0];paint()};
    tb.appendChild(p);
  });
  app.appendChild(tb);

  var mh=el("div","mh");
  var pv=el("button","nav","‹");pv.onclick=function(){view.setMonth(view.getMonth()-1);paint()};
  var nx=el("button","nav","›");nx.onclick=function(){view.setMonth(view.getMonth()+1);paint()};
  mh.appendChild(pv);mh.appendChild(el("strong",null,MON[view.getMonth()]+" "+view.getFullYear()));mh.appendChild(nx);app.appendChild(mh);
  var g=el("div","g");["S","M","T","W","T","F","S"].forEach(function(x){g.appendChild(el("div","dow",x))});
  var y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),td=today();
  for(var i=0;i<first;i++)g.appendChild(el("div","d empty"));
  for(var d=1;d<=dim;d++){(function(d){
    var k=ds(y,m,d),b=el("button","d"+(k===td?" today":""),d),dots=el("span","dots");
    if(data.me.indexOf(k)>-1)dots.appendChild(el("i","i-a"));
    if(data.wife.indexOf(k)>-1)dots.appendChild(el("i","i-b"));
    b.appendChild(dots);b.onclick=function(){toggle(k)};g.appendChild(b);
  })(d)}
  app.appendChild(g);
  var lg=el("div","leg");
  var l1=el("span");l1.appendChild(el("i","i-a"));l1.appendChild(document.createTextNode(name("wife")+" without "+name("me")+" ("+name("me")+" away)"));
  var l2=el("span");l2.appendChild(el("i","i-b"));l2.appendChild(document.createTextNode(name("me")+" without "+name("wife")+" ("+name("wife")+" away)"));
  lg.appendChild(l1);lg.appendChild(l2);
  app.appendChild(lg);
  app.appendChild(el("p","sub","Tap a day to mark or unmark when "+name(tg)+" was away from you."));

  var bx=el("div","box");bx.appendChild(el("h2",null,"Add or remove a range for "+name(tg)));
  var two=el("div","two"),fa=el("div"),ta=el("div");
  fa.appendChild(el("label",null,"From"));var fi=el("input");fi.type="date";fa.appendChild(fi);
  ta.appendChild(el("label",null,"To"));var ti=el("input");ti.type="date";ta.appendChild(ti);
  two.appendChild(fa);two.appendChild(ta);bx.appendChild(two);
  var br=el("div","two");br.style.marginTop="10px";
  var ad=el("button","btn p","Mark "+name(tg)+" away");ad.onclick=function(){addRange(fi.value,ti.value)};
  var rm=el("button","btn","Unmark "+name(tg));rm.onclick=function(){removeRange(fi.value,ti.value)};
  br.appendChild(ad);br.appendChild(rm);bx.appendChild(br);app.appendChild(bx);
  var s=el("div","st",status);s.id="st";app.appendChild(s);
}

function setup(app){
  app.appendChild(el("h1",null,"Setup JSONBin"));
  app.appendChild(el("p","sub","Enter your JSONBin.io access key and bin IDs for the user config and personal calendars."));
  var f={};
  [
    ["key","Access Key (X-Access-Key)"],
    ["ids","Users Bin ID (users)"],
    ["me","Vishu Bin ID (vishu)"],
    ["wife","Sabaa Bin ID (sabaa)"]
  ].forEach(function(p){
    app.appendChild(el("label",null,p[1]));var i=el("input");i.type="text";i.autocapitalize="off";i.autocomplete="off";i.value=cfg[p[0]]||"";f[p[0]]=i;app.appendChild(i);
  });
  var b=el("button","btn p","Save and open");b.style.marginTop="14px";b.style.width="100%";
  b.onclick=function(){
    var n={key:f.key.value.trim(),ids:f.ids.value.trim(),me:f.me.value.trim(),wife:f.wife.value.trim()};
    if(!n.key||!n.ids||!n.me||!n.wife)return;
    cfg=n;try{localStorage.setItem("apart-cfg",JSON.stringify(n))}catch(e){}
    screen="main";people=null;load();
  };
  app.appendChild(b);
  if(people){var c=el("button","btn","Cancel");c.style.marginTop="8px";c.style.width="100%";c.onclick=function(){screen="main";paint()};app.appendChild(c)}
  app.appendChild(el("p","sub","Your credentials and bin IDs are stored locally in your browser."));
}

paint();
if(screen!=="setup")load();
document.addEventListener("visibilitychange",function(){if(!document.hidden&&screen==="main"&&people&&document.activeElement.tagName!=="INPUT")load()});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manvish ✨</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<style>
:root {
  --bg: #fcf9fa;
  --card: #ffffff;
  --ink: #261920;
  --mute: #826e77;
  --line: #ede2e6;
  --line-strong: #dfcfd5;
  --primary: #e63974;
  --primary-sub: rgba(230, 57, 116, 0.08);
  --shadow: 0 4px 24px rgba(45, 20, 32, 0.06);
  --shadow-hover: 0 8px 32px rgba(45, 20, 32, 0.12);
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #140d11;
    --card: #1f141a;
    --ink: #fbf0f4;
    --mute: #a9959f;
    --line: #382530;
    --line-strong: #4d3342;
    --primary: #ff6599;
    --primary-sub: rgba(255, 101, 153, 0.12);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.55);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
.wrap {
  max-width: 580px;
  margin: 0 auto;
  padding: 32px 18px 48px;
}
header {
  margin-bottom: 22px;
}
.greeting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.date-pill {
  font-size: 12px;
  font-weight: 600;
  color: var(--mute);
  background: var(--primary-sub);
  padding: 4px 10px;
  border-radius: 20px;
  letter-spacing: 0.2px;
}
h1 {
  margin: 8px 0 4px;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sub {
  margin: 0;
  color: var(--mute);
  font-size: 14px;
}
.search-box {
  position: relative;
  margin: 20px 0 24px;
}
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  color: var(--mute);
  pointer-events: none;
}
#q {
  width: 100%;
  padding: 13px 14px 13px 40px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
#q:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-sub);
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
a.card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  color: inherit;
  text-decoration: none;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  position: relative;
  overflow: hidden;
}
a.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
  border-color: var(--line-strong);
}
a.card:active {
  transform: scale(0.98);
}
.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}
.icon-badge {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.category-tag {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 3px 8px;
  border-radius: 8px;
}
.card-mid {
  flex-grow: 1;
}
.nm {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.ds {
  font-size: 13px;
  color: var(--mute);
  line-height: 1.4;
}
.card-bottom {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
}
.card-arrow {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--primary-sub);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: transform 0.15s ease;
}
a.card:hover .card-arrow {
  transform: translateX(3px);
}
.empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--mute);
  padding: 40px 0;
  font-size: 14px;
}
footer {
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
  color: var(--mute);
}
footer span {
  display: inline-block;
  opacity: 0.85;
}
@media (max-width: 440px) {
  .grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .wrap {
    padding: 24px 14px 40px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="greeting-row">
      <span class="date-pill" id="today-date">Today</span>
      <span style="font-size:12px;color:var(--mute)">Vishu & Sabaa</span>
    </div>
    <h1 id="greeting">Manvish ✨</h1>
    <p class="sub">Your shared corner for everyday tools & love.</p>
  </header>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input id="q" type="search" placeholder="Search apps & tools…" autocomplete="off">
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span>Made with love for Vishu & Sabaa 💕</span>
  </footer>
</div>

<script>
var LINKS = [
  {
    id: "apart",
    icon: "💕",
    iconBg: "rgba(230, 57, 116, 0.12)",
    category: "Love & Distance",
    categoryBg: "rgba(230, 57, 116, 0.1)",
    categoryColor: "var(--primary)",
    name: "Days Apart",
    desc: "A romantic absence tracker — see who stayed without the other for how long.",
    url: "./apart.html",
    action: "Open tracker →"
  },
  {
    id: "diet",
    icon: "🍎",
    iconBg: "rgba(47, 143, 78, 0.12)",
    category: "Health & Routine",
    categoryBg: "rgba(47, 143, 78, 0.1)",
    categoryColor: "#2f8f4e",
    name: "Diet Tracker",
    desc: "Daily meals, timed eating schedule & progress tracker (16–25 Nov).",
    url: "./diet_tracker.html",
    action: "View schedule →"
  }
];

function initHeader() {
  var d = new Date();
  var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var dateEl = document.getElementById("today-date");
  if (dateEl) {
    dateEl.textContent = days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()];
  }

  var h = d.getHours();
  var greet = "Welcome, Vishu & Sabaa ✨";
  if (h < 12) greet = "Good morning, Vishu & Sabaa 🌅";
  else if (h < 17) greet = "Good afternoon, Vishu & Sabaa ☀️";
  else greet = "Good evening, Vishu & Sabaa 🌙";
  
  var greetEl = document.getElementById("greeting");
  if (greetEl) greetEl.textContent = greet;
}

var grid = document.getElementById("grid");
var q = document.getElementById("q");

function render() {
  var s = q.value.trim().toLowerCase();
  grid.textContent = "";
  var shown = LINKS.filter(function(l) {
    return !s || (l.name + " " + l.desc + " " + l.category).toLowerCase().indexOf(s) > -1;
  });

  shown.forEach(function(l) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = l.url;

    // Top
    var top = document.createElement("div");
    top.className = "card-top";

    var ico = document.createElement("div");
    ico.className = "icon-badge";
    ico.style.background = l.iconBg;
    ico.textContent = l.icon;
    top.appendChild(ico);

    var cat = document.createElement("span");
    cat.className = "category-tag";
    cat.style.background = l.categoryBg;
    cat.style.color = l.categoryColor;
    cat.textContent = l.category;
    top.appendChild(cat);
    a.appendChild(top);

    // Mid
    var mid = document.createElement("div");
    mid.className = "card-mid";
    var nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = l.name;
    mid.appendChild(nm);

    var ds = document.createElement("div");
    ds.className = "ds";
    ds.textContent = l.desc;
    mid.appendChild(ds);
    a.appendChild(mid);

    // Bottom
    var bot = document.createElement("div");
    bot.className = "card-bottom";
    var act = document.createElement("span");
    act.style.color = l.categoryColor;
    act.textContent = l.action;
    bot.appendChild(act);

    var arrow = document.createElement("div");
    arrow.className = "card-arrow";
    arrow.style.color = l.categoryColor;
    arrow.textContent = "→";
    bot.appendChild(arrow);
    a.appendChild(bot);

    grid.appendChild(a);
  });

  if (!shown.length) {
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No apps found matching \"" + s + "\" 🔍";
    grid.appendChild(e);
  }
}

initHeader();
q.addEventListener("input", render);
render();
</script>
</body>
</html>
